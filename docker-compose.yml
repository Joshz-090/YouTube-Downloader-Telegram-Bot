version: "3.9"

services:
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${API_ID}
      TELEGRAM_API_HASH: ${API_HASH}
    command: >
      --local
      --http-port=8081
      --log-verbosity=1
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - bot-api-data:/var/lib/telegram-bot-api
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/"]
      interval: 30s
      timeout: 10s
      retries: 3

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      LOCAL_API_URL: http://telegram-bot-api:8081
      TMP_DIR: /app/tmp
      DB_PATH: /app/data/bot.db
    depends_on:
      telegram-bot-api:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./tmp:/app/tmp
      - ./cookies.txt:/app/cookies.txt:ro
    working_dir: /app
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  bot-api-data:
